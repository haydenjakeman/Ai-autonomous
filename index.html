<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>Pulse</h1>
        <p id="status">AI not downloaded</p>
    </header>

    <main id="chat"></main>

    <div class="input-area">
        <input
            id="messageInput"
            type="text"
            placeholder="Ask Pulse anything..."
            autocomplete="off"
        >

        <button id="sendButton">
            Send
        </button>
    </div>

    <div class="buttons">

        <button id="downloadBrainButton">
            🧠 Download AI Brain
        </button>

        <button id="talkButton" disabled>
            🗣️ Talk by itself: OFF
        </button>

    </div>

    <p id="progress">
        Tap Download AI Brain to begin.
    </p>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
